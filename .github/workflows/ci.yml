name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel in-flight runs on new pushes to the same PR/branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # No pull-requests: write here. Fork PRs always get a read-only token, so the
  # coverage comment is posted by the separate coverage-comment.yml workflow,
  # which runs in the base-repo context (via workflow_run) with write access.

jobs:
  backend:
    name: backend (lint + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          version: "0.4.30"
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"

      - name: Install Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Test (with coverage)
        run: uv run pytest -v --cov --cov-report=term-missing --cov-report=xml:coverage.xml

      - name: Render coverage as markdown
        if: always()
        id: coverage-md
        run: |
          {
            echo "## Backend coverage"
            echo ""
            uv run coverage report --format=markdown
          } > coverage-summary.md
          # Echo to job summary too (visible on push-to-main runs that have no PR).
          cat coverage-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Record PR number for the comment workflow
        if: always() && github.event_name == 'pull_request'
        run: echo "${{ github.event.pull_request.number }}" > pr-number.txt

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          # coverage-summary.md + pr-number.txt are consumed by coverage-comment.yml;
          # coverage.xml is kept for download/inspection.
          path: |
            backend/coverage.xml
            backend/coverage-summary.md
            backend/pr-number.txt
          retention-days: 14
          if-no-files-found: warn

  flutter:
    name: app (analyze + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.0"
          channel: stable
          cache: true

      - name: pub get
        run: flutter pub get

      - name: analyze
        run: flutter analyze

      - name: test
        run: flutter test
